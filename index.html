<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Kho từ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2c27;
      --text: #33433c;
      --muted: #74817b;
      --green: #27715b;
      --green-dark: #1d5c49;
      --mint: #e6f1e9;
      --paper: #fffefa;
      --line: #e7e9e1;
      --bg: #f6f7f3;
      --danger: #b65a4f;
      --shadow: 0 16px 50px rgb(42 59 49 / 7%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .hidden { display: none !important; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }

    /* thanh trên */
    .top {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 12px 20px; min-height: 72px; padding: 12px max(28px, calc((100vw - 1160px) / 2));
      background: rgb(255 254 250 / 88%);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-family: Manrope, sans-serif; font-weight: 800; letter-spacing: -.04em; font-size: 20px; }
    .logo {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 11px; background: var(--green); color: #fff; font-size: 18px; font-weight: 800;
    }
    .top-right { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
    .meter { display: flex; align-items: center; gap: 12px; }
    .count {
      padding: 8px 14px; border: 1px solid var(--line); border-radius: 99px;
      background: var(--paper); color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    .meter-bar { width: 120px; height: 6px; border-radius: 99px; background: #e4ebe6; overflow: hidden; }
    .meter-fill { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--green); transition: width .3s; }
    .voice { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }

    select, .input {
      height: 42px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: 10px;
      background: #fff; color: var(--ink);
      transition: border-color .15s, box-shadow .15s;
    }
    select:focus, .input:focus { outline: none; border-color: #88ae9c; box-shadow: 0 0 0 3px rgb(39 113 91 / 9%); }

    /* nút */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 42px; padding: 0 18px;
      border: 1px solid var(--line); border-radius: 10px;
      background: #fff; color: var(--text);
      font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap;
      transition: background .15s, border-color .15s, color .15s, transform .15s;
    }
    .btn:hover { border-color: #cdd6d0; color: var(--green); background: #fff; }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgb(39 113 91 / 15%); }
    .btn:disabled { opacity: .55; cursor: wait; }
    .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.primary:hover { background: var(--green-dark); border-color: var(--green-dark); color: #fff; transform: translateY(-1px); }
    .btn.danger { color: var(--danger); }
    .btn.danger:hover { color: var(--danger); border-color: #ecd0cb; background: #fff; }
    .btn.small { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
    a.btn { text-decoration: none; }

    /* đường dẫn */
    .crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; padding: 22px max(28px, calc((100vw - 1160px) / 2)) 0; color: var(--muted); font-size: 14px; }
    .crumbs button { padding: 5px 9px; border: 0; border-radius: 9px; background: none; color: var(--text); font-weight: 600; }
    .crumbs button:hover { background: #fff; color: var(--green); }
    .crumbs .sep { color: #b3bcb6; }
    .crumbs .back { margin-right: 6px; color: var(--green); font-weight: 700; }

    /* nội dung */
    .main { max-width: 1160px; padding: 14px max(28px, calc((100vw - 1160px) / 2)) 72px; }
    .main h2.title { margin: 0; color: var(--ink); font: 800 clamp(28px, 4vw, 40px)/1.12 Manrope, sans-serif; letter-spacing: -.045em; }
    .sub { margin: 6px 0 22px; color: var(--muted); font-size: 15px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }

    /* thẻ thư mục / file */
    .card {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 10px; padding: 12px 14px 12px 12px;
      background: var(--paper); border: 1px solid var(--line);
      border-radius: 18px; box-shadow: var(--shadow);
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: #cfdcd4; transform: translateY(-1px); }
    .ico { width: 42px; height: 42px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 13px; }
    .ico svg { width: 22px; height: 22px; }
    .ico-dir { background: var(--mint); color: var(--green); }
    .ico-file { background: #f7ece2; color: #b56d2e; }
    .card-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 4px 0; border: 0; background: none; text-align: left; }
    .card-name { display: block; color: var(--ink); font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; }
    .card-main:hover .card-name { color: var(--green); }
    .card-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

    /* thêm từ */
    .add-form {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-bottom: 22px; padding: 14px;
      background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
    }
    .add-form .input { flex: 1; min-width: 220px; height: 50px; font-size: 16px; }
    .add-form .btn { height: 50px; padding: 0 26px; font-size: 15px; }

    /* dòng từ */
    .word-row {
      display: grid; grid-template-columns: 30px auto minmax(0, 1fr) auto auto;
      align-items: center; gap: 14px;
      margin-bottom: 10px; padding: 14px 16px;
      background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
    }
    .slot {
      width: 28px; height: 28px; display: grid; place-items: center;
      border-radius: 9px; background: var(--mint); color: var(--green);
      font-size: 13px; font-weight: 800;
    }
    .slot.none { background: transparent; }
    .word-text { min-width: 0; }
    .word-name { color: var(--ink); font: 800 19px/1.2 Manrope, sans-serif; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ipa { margin-top: 3px; color: var(--muted); font-size: 14px; font-family: "Noto Sans", "DejaVu Sans", system-ui, sans-serif; }
    .word-row .btn[data-action="play"] { min-width: 92px; background: var(--mint); border-color: #d5e6db; color: var(--green); }
    .word-row .btn[data-action="play"]:hover { background: #d9eadf; color: var(--green-dark); }
    .word-row .btn[data-action="play"]:disabled { color: var(--green); }

    .empty {
      padding: 36px 20px; text-align: center; color: var(--muted);
      background: var(--paper); border: 1px dashed #cdd5cc; border-radius: 18px; font-size: 14px;
    }

    /* thông báo */
    .toast {
      position: fixed; left: 50%; bottom: 26px; max-width: calc(100vw - 32px);
      padding: 12px 18px; border-radius: 12px;
      background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 12px 30px rgba(30, 44, 39, .25);
      opacity: 0; transform: translate(-50%, 14px); transition: .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* hộp thoại */
    .backdrop {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px;
      background: rgb(26 38 31 / 42%); backdrop-filter: blur(2px);
      animation: fade .15s ease-out;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .dialog {
      width: min(440px, 100%); max-height: 86vh; overflow: auto; padding: 24px;
      background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 25px 80px rgb(15 31 21 / 20%);
      animation: pop .15s ease-out;
    }
    @keyframes pop { from { transform: translateY(6px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
    .dialog h2 { margin: 0 0 8px; color: var(--ink); font: 800 22px Manrope, sans-serif; letter-spacing: -.03em; }
    .dialog p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .dialog .input { width: 100%; margin-bottom: 20px; }
    .dialog .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; max-height: 50vh; overflow: auto; }
    .dialog .choices .btn { width: 100%; justify-content: flex-start; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    .row.end { justify-content: flex-end; }

    @media (max-width: 720px) {
      .top { padding: 12px 16px; }
      .main { padding: 12px 16px 64px; }
      .crumbs { padding: 16px 16px 0; }
      .meter-bar { width: 80px; }
      .word-row { grid-template-columns: 28px minmax(0, 1fr) auto; }
      .word-row .btn[data-action="play"] { grid-column: 2; justify-self: start; }
      .word-row .btn[data-action="del-word"] { grid-column: 3; grid-row: 1; }
      .word-row a.btn { display: none; }
      .card-btns { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">K</span><span>Kho từ</span></div>
    <div class="top-right">
      <div class="meter"><span class="count" id="count"></span><span class="meter-bar"><span class="meter-fill" id="meter-fill"></span></span></div>
      <label class="voice">Giọng đọc
        <select id="voice" aria-label="Giọng đọc"><option value="uk">Anh-Anh (UK)</option></select>
      </label>
    </div>
  </header>
  <nav class="crumbs" id="crumbs" aria-label="Đường dẫn"></nav>
  <main class="main" id="view"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="backdrop hidden" id="backdrop">
    <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <script>
    (() => {
      "use strict";
      const SPEECH_API = "https://kho-tu-kho.vercel.app/api/speak";
      const STORE_KEY = "word-cabinet.store.v3";
      const OLD_TREE_KEY = "word-cabinet.tree.v2";
      const OLD_WORDS_KEY = "word-cabinet.words.v1";
      const VOICE_KEY = "word-cabinet.accent";
      const IPA_KEY = "word-cabinet.ipa.v1";
      const RECENT_KEY = "word-cabinet.recent.local";
      const MAX_WORDS = 1000;
      const MAX_FILES = 100;
      const MAX_FOLDERS = 60;
      const MAX_DEPTH = 4;
      const MAX_NAME = 40;
      const MAX_WORD = 80;
      const RECENT_LIMIT = 20;
      const HOTKEYS = 5;
      const VOICE_FALLBACK = [
        { value: "uk", label: "Anh-Anh (UK)" },
        { value: "us", label: "Anh-Mỹ (US)" },
      ];
      const VOCAB_FILE = "Từ vựng";
      const VOCAB_FLAG = "word-cabinet.layout.v4";
      const ICON_FOLDER = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>';
      const ICON_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M9 12h6M9 16h6"/></svg>';

      const $ = id => document.getElementById(id);
      const view = $("view");
      const crumbsEl = $("crumbs");
      const toastEl = $("toast");
      const backdrop = $("backdrop");
      const dialogEl = $("dialog");
      const voiceEl = $("voice");
      const countEl = $("count");
      const meterEl = $("meter-fill");

      let root = { type: "dir", name: "", children: [] };
      let current = [];
      let recent = readJSON(RECENT_KEY, []).filter(item => typeof item === "string").slice(0, RECENT_LIMIT);
      let dialogCancel = null;
      let playbackId = 0;
      let cancelCurrent = null;
      let activeAudio = null;
      let activeAudioUrl = null;
      let toastTimer;

      // ---------- lưu trữ trên máy ----------
      function safeGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
      function safeSet(key, value) { try { localStorage.setItem(key, value); return true; } catch { return false; } }
      function readJSON(key, fallback) {
        try { return JSON.parse(safeGet(key) ?? "null") ?? fallback; } catch { return fallback; }
      }

      // Đưa dữ liệu từ các phiên bản trước vào cấu trúc hiện tại.
      function convertFromV2(children) {
        const result = [];
        const loose = [];
        for (const node of children) {
          if (node.type === "dir") result.push({ type: "dir", name: node.name, children: convertFromV2(node.children || []) });
          else loose.push({ word: node.name, addedAt: Number(node.addedAt) || 0 });
        }
        if (loose.length) result.push({ type: "file", name: VOCAB_FILE, words: loose });
        return result;
      }

      // Gộp file "Từ vựng" nằm trong thư mục week1 hoặc ngoài cùng về một file "Từ vựng" ở gốc.
      function tidyLayout(children) {
        const result = [];
        const pushVocab = words => {
          const existing = result.find(n => n.type === "file" && n.name === VOCAB_FILE);
          if (existing) {
            const keys = new Set(existing.words.map(w => w.word.toLowerCase()));
            existing.words.push(...words.filter(w => !keys.has(w.word.toLowerCase())));
          } else {
            result.push({ type: "file", name: VOCAB_FILE, words: [...words] });
          }
        };
        for (const node of children) {
          const isLegacyFile = node.type === "file" && /^(từ cũ|từ)$/i.test(node.name);
          const isWeek1 = node.type === "dir" && node.name === "week1" && node.children.length === 1
            && node.children[0].type === "file" && /^(từ cũ|từ)$/i.test(node.children[0].name);
          if (isLegacyFile) pushVocab(node.words);
          else if (isWeek1) pushVocab(node.children[0].words);
          else result.push(node);
        }
        return result;
      }

      function loadStore() {
        const saved = readJSON(STORE_KEY, null);
        if (Array.isArray(saved)) {
          if (safeGet(VOCAB_FLAG)) return saved;
          const tidied = tidyLayout(saved);
          safeSet(VOCAB_FLAG, "1");
          safeSet(STORE_KEY, JSON.stringify(tidied));
          return tidied;
        }
        const v2 = readJSON(OLD_TREE_KEY, null);
        if (Array.isArray(v2)) return convertFromV2(v2);
        const v1 = readJSON(OLD_WORDS_KEY, []);
        const words = (Array.isArray(v1) ? v1 : [])
          .filter(item => item && typeof item.word === "string" && item.word.trim())
          .map(item => ({ word: item.word.trim().replace(/\s+/g, " ").slice(0, MAX_WORD), addedAt: Number(item.addedAt) || 0 }));
        return words.length ? [{ type: "file", name: VOCAB_FILE, words }] : [];
      }

      function saveStore() {
        if (!safeSet(STORE_KEY, JSON.stringify(root.children))) {
          toast("Không lưu được trên máy này. Hãy kiểm tra dung lượng trình duyệt.");
        }
      }

      function touchRecent(key) {
        recent = [key, ...recent.filter(item => item !== key)].slice(0, RECENT_LIMIT);
        safeSet(RECENT_KEY, JSON.stringify(recent));
      }

      // ---------- cây thư mục ----------
      const pathKey = parts => JSON.stringify(parts);
      const sameParts = (a, b) => a.length === b.length && a.every((part, i) => part === b[i]);
      const isPrefix = (prefix, parts) => prefix.length <= parts.length && prefix.every((part, i) => parts[i] === part);

      function getNode(parts) {
        let node = root;
        for (const name of parts) {
          if (!node || node.type !== "dir") return null;
          node = node.children.find(child => child.name === name) || null;
        }
        return node;
      }

      function sortedChildren(dir) {
        const byName = (a, b) => a.name.localeCompare(b.name, "vi");
        return [...dir.children.filter(c => c.type === "dir").sort(byName), ...dir.children.filter(c => c.type === "file").sort(byName)];
      }

      function totals(node) {
        const result = { folders: 0, files: 0, words: 0 };
        if (node.type === "file") {
          result.files = 1;
          result.words = node.words.length;
          return result;
        }
        for (const child of node.children) {
          const sub = totals(child);
          result.folders += child.type === "dir" ? 1 + sub.folders : sub.folders;
          result.files += sub.files;
          result.words += sub.words;
        }
        return result;
      }

      function height(node) {
        if (node.type !== "dir") return 0;
        let h = 0;
        for (const child of node.children) if (child.type === "dir") h = Math.max(h, height(child));
        return h + 1;
      }

      function checkName(name) {
        if (!name || name === "." || name === ".." || name.length > MAX_NAME || /[\/\x00-\x1f\x7f]/.test(name)) {
          throw new Error(`Tên dùng tối đa ${MAX_NAME} ký tự và không có dấu “/”.`);
        }
      }

      function ensureUniqueName(dir, name, exceptNode = null) {
        if (dir.children.some(c => c !== exceptNode && c.name.toLowerCase() === name.toLowerCase())) {
          throw new Error(`Đã có “${name}” trong thư mục này.`);
        }
      }

      // ---------- giọng đọc ----------
      async function loadVoices() {
        let list = VOICE_FALLBACK;
        try {
          const response = await fetch(`${SPEECH_API}?voices=1`);
          const data = await response.json();
          if (Array.isArray(data.voices) && data.voices.length) list = data.voices;
        } catch { /* dùng danh sách mặc định */ }
        const saved = safeGet(VOICE_KEY) || "uk";
        voiceEl.innerHTML = list.map(v => `<option value="${escapeHtml(v.value)}">${escapeHtml(v.label)}</option>`).join("");
        voiceEl.value = list.some(v => v.value === saved) ? saved : list[0].value;
      }

      voiceEl.addEventListener("change", () => {
        safeSet(VOICE_KEY, voiceEl.value);
        render();
      });

      // ---------- giao diện ----------
      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
      }

      function toast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3000);
      }

      function go(parts) {
        current = parts;
        render();
        window.scrollTo(0, 0);
      }

      function render() {
        if (!getNode(current)) current = [];
        const used = totals(root).words;
        countEl.textContent = `${used} / ${MAX_WORDS} từ`;
        meterEl.style.width = `${Math.min(100, (used / MAX_WORDS) * 100)}%`;
        renderCrumbs();
        renderView();
      }

      function renderCrumbs() {
        const parts = [];
        if (current.length) parts.push('<button class="back" type="button" data-back>← Quay lại</button>');
        parts.push(`<button type="button" data-go="[]">Trang chủ</button>`);
        current.forEach((name, i) => {
          parts.push(`<span class="sep">/</span><button type="button" data-go="${escapeHtml(pathKey(current.slice(0, i + 1)))}">${escapeHtml(name)}</button>`);
        });
        crumbsEl.innerHTML = parts.join("");
      }

      function renderView() {
        const node = getNode(current);
        if (node.type === "dir") renderFolder(node);
        else renderFile(node);
      }

      function cardHtml(node, parts) {
        const key = escapeHtml(pathKey(parts));
        const sub = totals(node);
        const meta = node.type === "dir" ? `${sub.folders} thư mục · ${sub.words} từ` : `${sub.words} từ`;
        const isDir = node.type === "dir";
        return `<div class="card">
          <button class="card-main" type="button" data-open="${key}">
            <span class="ico ${isDir ? "ico-dir" : "ico-file"}">${isDir ? ICON_FOLDER : ICON_FILE}</span>
            <span style="min-width:0">
              <span class="card-name">${escapeHtml(node.name)}</span>
              <span class="card-meta">${meta}</span>
            </span>
          </button>
          <div class="card-btns">
            <button class="btn small" type="button" data-action="rename" data-path="${key}">Đổi tên</button>
            <button class="btn small" type="button" data-action="move" data-path="${key}">Di chuyển</button>
            <button class="btn small danger" type="button" data-action="delete" data-path="${key}">Xóa</button>
          </div>
        </div>`;
      }

      function renderFolder(dir) {
        const kids = sortedChildren(dir);
        const list = kids.length
          ? kids.map(kid => cardHtml(kid, [...current, kid.name])).join("")
          : '<div class="empty">Chưa có gì ở đây. Bấm “Thư mục mới” hoặc “File mới”.</div>';
        view.innerHTML = `<h2 class="title">${current.length ? escapeHtml(dir.name) : "Trang chủ"}</h2>
          <p class="sub">${current.length ? "Thư mục" : "Thư mục và file của bạn"}</p>
          <div class="toolbar">
            <button class="btn primary" type="button" data-new="dir">Thư mục mới</button>
            <button class="btn primary" type="button" data-new="file">File mới</button>
          </div>
          ${list}`;
      }

      function wordRowHtml(fileParts, item) {
        const key = pathKey([...fileParts, item.word]);
        const safeKey = escapeHtml(key);
        const slot = recent.indexOf(key) + 1;
        const badge = slot > 0 && slot <= HOTKEYS ? `<span class="slot">${slot}</span>` : '<span class="slot none"></span>';
        const cambridge = `https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(item.word.toLowerCase()).replace(/%20/g, "-")}`;
        return `<div class="word-row" data-key="${safeKey}">
          ${badge}
          <button class="btn small" type="button" data-action="play" data-key="${safeKey}">Nghe</button>
          <div class="word-text"><div class="word-name">${escapeHtml(item.word)}</div><div class="ipa" data-ipa="${escapeHtml(item.word.toLowerCase())}">${escapeHtml(ipaText(item.word))}</div></div>
          <a class="btn small" href="${cambridge}" target="_blank" rel="noopener noreferrer">Cambridge</a>
          <button class="btn small danger" type="button" data-action="del-word" data-word="${escapeHtml(item.word)}">Xóa</button>
        </div>`;
      }

      function renderFile(file) {
        const words = [...file.words].sort((a, b) => b.addedAt - a.addedAt);
        words.forEach(item => queueIpa(item.word));
        const rows = words.length
          ? words.map(item => wordRowHtml(current, item)).join("")
          : '<div class="empty">File này chưa có từ nào. Nhập từ ở ô trên rồi bấm “Thêm”.</div>';
        view.innerHTML = `<h2 class="title">${escapeHtml(file.name)}</h2>
          <p class="sub">${file.words.length} từ</p>
          <form class="add-form" id="add-form">
            <input class="input" id="word-input" placeholder="Nhập từ tiếng Anh" maxlength="${MAX_WORD}" autocomplete="off">
            <button class="btn primary" type="submit">Thêm</button>
          </form>
          ${rows}`;
      }

      // ---------- hộp thoại ----------
      function showDialog(build, cancelValue) {
        return new Promise(resolve => {
          const finish = value => {
            backdrop.classList.add("hidden");
            dialogEl.innerHTML = "";
            dialogCancel = null;
            resolve(value);
          };
          dialogCancel = () => finish(cancelValue);
          dialogEl.innerHTML = "";
          backdrop.classList.remove("hidden");
          build(dialogEl, finish);
        });
      }

      backdrop.addEventListener("mousedown", event => {
        if (event.target === backdrop && dialogCancel) dialogCancel();
      });

      function ask(title, value = "", okText = "Tạo") {
        return showDialog((el, done) => {
          el.innerHTML = `<h2>${escapeHtml(title)}</h2>
            <input class="input" id="dlg-input" maxlength="${MAX_NAME}" value="${escapeHtml(value)}">
            <div class="row end"><button class="btn" type="button" data-cancel>Hủy</button><button class="btn primary" type="button" data-ok>${escapeHtml(okText)}</button></div>`;
          const input = el.querySelector("#dlg-input");
          const submit = () => done(input.value.trim() || null);
          el.querySelector("[data-ok]").onclick = submit;
          el.querySelector("[data-cancel]").onclick = () => done(null);
          input.onkeydown = event => { if (event.key === "Enter") submit(); };
          input.focus();
          input.select();
        }, null);
      }

      function confirmBox(title, text, okText, cancelText, danger = false) {
        return showDialog((el, done) => {
          el.innerHTML = `<h2>${escapeHtml(title)}</h2><p>${escapeHtml(text)}</p>
            <div class="row end"><button class="btn" type="button" data-cancel>${escapeHtml(cancelText)}</button><button class="btn ${danger ? "danger" : "primary"}" type="button" data-ok>${escapeHtml(okText)}</button></div>`;
          el.querySelector("[data-ok]").onclick = () => done(true);
          el.querySelector("[data-cancel]").onclick = () => done(false);
          el.querySelector("[data-ok]").focus();
        }, false);
      }

      function pickFolder(title, targets) {
        return showDialog((el, done) => {
          el.innerHTML = `<h2>${escapeHtml(title)}</h2><div class="choices">${targets.map((t, i) =>
            `<button class="btn" type="button" data-choice="${i}">${escapeHtml(t.label)}</button>`).join("")}</div>
            <div class="row end"><button class="btn" type="button" data-cancel>Hủy</button></div>`;
          el.querySelectorAll("[data-choice]").forEach(button => {
            button.onclick = () => done(targets[Number(button.dataset.choice)].parts);
          });
          el.querySelector("[data-cancel]").onclick = () => done(null);
        }, null);
      }

      // ---------- thư mục và file ----------
      async function createItem(kind) {
        const name = await ask(kind === "dir" ? "Tên thư mục mới" : "Tên file mới", "", "Tạo");
        if (!name) return;
        try {
          checkName(name);
          const dir = getNode(current);
          ensureUniqueName(dir, name);
          const counts = totals(root);
          if (kind === "dir") {
            if (current.length + 1 > MAX_DEPTH) throw new Error(`Thư mục chỉ được lồng tối đa ${MAX_DEPTH} cấp.`);
            if (counts.folders >= MAX_FOLDERS) throw new Error(`Tối đa ${MAX_FOLDERS} thư mục.`);
            dir.children.push({ type: "dir", name, children: [] });
          } else {
            if (counts.files >= MAX_FILES) throw new Error(`Tối đa ${MAX_FILES} file.`);
            dir.children.push({ type: "file", name, words: [] });
          }
          saveStore();
          render();
          toast(`Đã tạo “${name}”.`);
        } catch (error) {
          toast(error.message);
        }
      }

      async function renameItem(parts) {
        const node = getNode(parts);
        const parent = getNode(parts.slice(0, -1));
        const name = await ask("Đổi tên", node.name, "Lưu");
        if (!name || name === node.name) return;
        try {
          checkName(name);
          ensureUniqueName(parent, name, node);
          node.name = name;
          if (isPrefix(parts, current)) current = [...parts.slice(0, -1), name, ...current.slice(parts.length)];
          saveStore();
          render();
        } catch (error) {
          toast(error.message);
        }
      }

      function folderTargets(node, nodeParts) {
        const list = [];
        const walk = (dir, dirParts) => {
          const inside = isPrefix(nodeParts, dirParts);
          const isCurrentParent = sameParts(dirParts, nodeParts.slice(0, -1));
          if (!inside && !isCurrentParent && dirParts.length + height(node) <= MAX_DEPTH) {
            list.push({ parts: dirParts, label: dirParts.length ? dirParts.join(" / ") : "Trang chủ" });
          }
          for (const child of dir.children) {
            if (child.type === "dir") walk(child, [...dirParts, child.name]);
          }
        };
        walk(root, []);
        return list;
      }

      async function moveItem(parts) {
        const node = getNode(parts);
        const targets = folderTargets(node, parts);
        if (!targets.length) {
          toast("Không có thư mục đích phù hợp.");
          return;
        }
        const dest = await pickFolder(`Chuyển “${node.name}” đến`, targets);
        if (!dest) return;
        try {
          const target = getNode(dest);
          ensureUniqueName(target, node.name);
          const parent = getNode(parts.slice(0, -1));
          parent.children.splice(parent.children.indexOf(node), 1);
          target.children.push(node);
          if (isPrefix(parts, current)) current = [...dest, node.name, ...current.slice(parts.length)];
          saveStore();
          render();
          toast(`Đã chuyển “${node.name}”.`);
        } catch (error) {
          toast(error.message);
        }
      }

      async function deleteItem(parts) {
        const node = getNode(parts);
        const text = node.type === "dir" ? "Mọi thư mục và file bên trong sẽ mất." : "Mọi từ trong file này sẽ mất.";
        const ok = await confirmBox(`Xóa “${node.name}”?`, text, "Xóa", "Hủy", true);
        if (!ok) return;
        const parent = getNode(parts.slice(0, -1));
        parent.children.splice(parent.children.indexOf(node), 1);
        if (isPrefix(parts, current)) current = parts.slice(0, -1);
        saveStore();
        render();
        toast(`Đã xóa “${node.name}”.`);
      }

      // ---------- từ vựng ----------
      async function addWord(raw) {
        const word = raw.trim().replace(/\s+/g, " ");
        if (!word) return;
        const fileParts = [...current];
        const file = getNode(fileParts);
        try {
          if (word.length > MAX_WORD) throw new Error(`Từ dùng tối đa ${MAX_WORD} ký tự.`);
          if (/[\x00-\x1f\x7f]/.test(word)) throw new Error("Từ có ký tự không hợp lệ.");
          if (file.words.some(item => item.word.toLowerCase() === word.toLowerCase())) throw new Error("Từ này đã có trong file này.");
          if (totals(root).words >= MAX_WORDS) throw new Error(`Tối đa ${MAX_WORDS} từ.`);
        } catch (error) {
          toast(error.message);
          return;
        }
        const ok = await confirmBox(`Thêm “${word}”?`, `Từ sẽ được lưu vào “${file.name}”.`, "Lưu", "Để sau");
        if (!ok) return;
        file.words.push({ word, addedAt: Date.now() });
        saveStore();
        render();
        toast(`Đã thêm “${word}”.`);
        playWord(fileParts, word);
      }

      async function removeWord(word) {
        const ok = await confirmBox(`Xóa “${word}”?`, "Từ này sẽ bị xóa khỏi file.", "Xóa", "Hủy", true);
        if (!ok) return;
        const file = getNode(current);
        file.words = file.words.filter(item => item.word !== word);
        saveStore();
        render();
        toast(`Đã xóa “${word}”.`);
      }

      // ---------- phiên âm IPA ----------
      let ipaChain = Promise.resolve();
      const ipaCache = readJSON(IPA_KEY, {});
      const ipaPending = new Set();

      function parseIpa(data) {
        const entry = Array.isArray(data) ? data[0] : null;
        const phonetics = entry?.phonetics || [];
        const pick = region => {
          const hit = phonetics.find(p => p.text && (p.audio || "").includes(`-${region}.`));
          return hit ? hit.text : null;
        };
        const any = entry?.phonetic || phonetics.find(p => p.text)?.text || null;
        return { uk: pick("uk"), us: pick("us"), any };
      }

      async function fetchIpa(word) {
        const key = word.toLowerCase();
        if (key in ipaCache || ipaPending.has(key)) return;
        ipaPending.add(key);
        try {
          const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`);
          ipaCache[key] = response.ok ? parseIpa(await response.json()) : { uk: null, us: null, any: null };
          safeSet(IPA_KEY, JSON.stringify(ipaCache));
          document.querySelectorAll("[data-ipa]").forEach(el => {
            if (el.dataset.ipa === key) el.textContent = ipaText(key);
          });
        } catch {
          // lỗi mạng: không lưu cache, lần sau sẽ thử lại
        } finally {
          ipaPending.delete(key);
        }
      }

      function queueIpa(word) {
        ipaChain = ipaChain.then(() => fetchIpa(word));
      }

      function ipaText(word) {
        const entry = ipaCache[word.toLowerCase()];
        if (!entry) return "đang tải phiên âm…";
        const region = voiceEl.value === "us" ? "us" : "uk";
        return entry[region] || entry.any || "chưa có phiên âm";
      }

      // ---------- phát âm ----------
      function findWordRow(key) {
        return [...view.querySelectorAll(".word-row")].find(row => row.dataset.key === key) || null;
      }

      function setWordBusy(key, busy) {
        const button = findWordRow(key)?.querySelector('[data-action="play"]');
        if (!button) return;
        button.disabled = busy;
        button.textContent = busy ? "Đang đọc…" : "Nghe";
      }

      function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function playOnce(audio) {
        return new Promise((resolve, reject) => {
          const clear = () => {
            audio.onended = null;
            audio.onerror = null;
            cancelCurrent = null;
          };
          cancelCurrent = () => { clear(); resolve(); };
          audio.onended = () => { clear(); resolve(); };
          audio.onerror = () => {
            clear();
            reject(new Error("Không phát được audio trên thiết bị này."));
          };
          audio.currentTime = 0;
          audio.play().catch(error => {
            clear();
            reject(error);
          });
        });
      }

      function stopAudio() {
        if (cancelCurrent) {
          const cancel = cancelCurrent;
          cancelCurrent = null;
          cancel();
        }
        if (activeAudio) {
          activeAudio.pause();
          activeAudio = null;
        }
        if (activeAudioUrl) {
          URL.revokeObjectURL(activeAudioUrl);
          activeAudioUrl = null;
        }
      }

      async function getAudioUrl(word, voice) {
        const url = `${SPEECH_API}?text=${encodeURIComponent(word)}&accent=${encodeURIComponent(voice)}`;
        const response = await fetch(url);
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.error || "Máy chủ chưa tạo được audio. Vui lòng thử lại.");
        }
        if (!response.headers.get("content-type")?.includes("audio/")) {
          throw new Error("Máy chủ trả về dữ liệu không phải audio.");
        }
        return URL.createObjectURL(await response.blob());
      }

      async function playWord(fileParts, word, { track = true } = {}) {
        const key = pathKey([...fileParts, word]);
        if (track) {
          touchRecent(key);
          if (isPrefix(fileParts, current)) render();
        }
        const requestId = ++playbackId;
        stopAudio();
        setWordBusy(key, true);
        try {
          const audioUrl = await getAudioUrl(word, voiceEl.value);
          if (requestId !== playbackId) {
            URL.revokeObjectURL(audioUrl);
            return;
          }
          activeAudioUrl = audioUrl;
          const audio = new Audio(audioUrl);
          activeAudio = audio;
          for (let count = 0; count < 2; count += 1) {
            await playOnce(audio);
            if (requestId !== playbackId) return;
            if (count === 0) await wait(550);
            if (requestId !== playbackId) return;
          }
        } catch (error) {
          if (requestId === playbackId) toast(error.message || "Không tạo được audio.");
        } finally {
          if (requestId === playbackId) stopAudio();
          setWordBusy(key, false);
        }
      }

      async function playRecent(slot) {
        const key = recent[slot - 1];
        if (!key) {
          toast(`Chưa có từ ở phím ${slot}. Hãy nghe một từ trước.`);
          return;
        }
        const parts = JSON.parse(key);
        const word = parts[parts.length - 1];
        const fileParts = parts.slice(0, -1);
        const file = getNode(fileParts);
        if (!file || file.type !== "file" || !file.words.some(item => item.word === word)) {
          recent = recent.filter(item => item !== key);
          safeSet(RECENT_KEY, JSON.stringify(recent));
          render();
          toast("Từ này đã bị xóa.");
          return;
        }
        await playWord(fileParts, word, { track: false });
      }

      // ---------- sự kiện ----------
      view.addEventListener("click", event => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.open !== undefined) return go(JSON.parse(button.dataset.open));
        if (button.dataset.new) return createItem(button.dataset.new);
        const action = button.dataset.action;
        if (action === "play") {
          const parts = JSON.parse(button.dataset.key);
          return playWord(parts.slice(0, -1), parts[parts.length - 1]);
        }
        if (action === "del-word") return removeWord(button.dataset.word);
        if (action === "rename") return renameItem(JSON.parse(button.dataset.path));
        if (action === "move") return moveItem(JSON.parse(button.dataset.path));
        if (action === "delete") return deleteItem(JSON.parse(button.dataset.path));
      });

      view.addEventListener("submit", event => {
        if (event.target.id !== "add-form") return;
        event.preventDefault();
        addWord($("word-input").value);
      });

      crumbsEl.addEventListener("click", event => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.hasAttribute("data-back")) go(current.slice(0, -1));
        else go(JSON.parse(button.dataset.go));
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && dialogCancel) {
          dialogCancel();
          return;
        }
        if (dialogCancel || event.ctrlKey || event.metaKey || event.altKey || event.shiftKey || event.repeat) return;
        const target = event.target;
        if (target && ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName) && target.value !== "") return;
        if (!/^[1-5]$/.test(event.key)) return;
        event.preventDefault();
        playRecent(Number(event.key));
      });

      // ---------- khởi động ----------
      root.children = loadStore();
      const visit = node => {
        if (node.type === "file") node.words.forEach(item => queueIpa(item.word));
        else node.children.forEach(visit);
      };
      root.children.forEach(visit);
      render();
      loadVoices().then(render);
    })();
  </script>
</body>
</html>
